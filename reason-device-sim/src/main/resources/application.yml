server:
  port: 8300
  servlet:
    context-path: /

spring:
  application:
    name: reason-device-sim
  jackson:
    default-property-inclusion: non_null

# 健康检查最小暴露（云服务器探活用）
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.reason.device: DEBUG

reason:
  device-sim:
    # 设备通道密钥：与 reason-main 侧 reason.device.access-token 保持一致
    access-token: sim-device-token-2026
    # reason-main 设备接入服务地址（本地双进程联调；云部署改为内网地址）
    parking-api-base-url: http://127.0.0.1:8200/api
    # 手写设备清单：停车演示设备（entry/exit 直报车位，M1 语义，B 块后退役）+ 出入口闸机 6（无车位绑定）
    devices:
      - deviceNo: DEV-001
        spaceNo: A-001
        deviceType: PARK_DEVICE
      - deviceNo: DEV-002
        spaceNo: A-002
        deviceType: PARK_DEVICE
      - deviceNo: DEV-003
        spaceNo: A-003
        deviceType: PARK_DEVICE
      - deviceNo: GATE-E-IN
        deviceType: ENTRY_GATE
      - deviceNo: GATE-E-OUT
        deviceType: EXIT_GATE
      - deviceNo: GATE-S-IN
        deviceType: ENTRY_GATE
      - deviceNo: GATE-S-OUT
        deviceType: EXIT_GATE
      - deviceNo: GATE-W-IN
        deviceType: ENTRY_GATE
      - deviceNo: GATE-W-OUT
        deviceType: EXIT_GATE
    # 批量区段：按车位区段展开位检（每车位 1 台）与充电桩（30 台绑 C 区），与 db/08 资产同构
    sections:
      - deviceType: SENSOR
        noPrefix: SENSOR-A-
        area: A
        from: 1
        to: 140
      - deviceType: SENSOR
        noPrefix: SENSOR-B-
        area: B
        from: 1
        to: 130
      - deviceType: SENSOR
        noPrefix: SENSOR-C-
        area: C
        from: 1
        to: 30
      - deviceType: CHARGING_PILE
        noPrefix: PILE-
        area: C
        from: 1
        to: 30
    # 心跳批量上报（每周期聚合全部设备在线态；main 端 /device/heartbeat 已就绪，默认开启；心跳失败仅告警抑制不中断）
    heartbeat:
      enabled: true
      interval-seconds: 10
    # 自动剧本：true 时按剧本循环上报（演示满停车场动态）；false 时由 /sim/event 手工触发（联调可控）
    auto:
      enable: false
      # 剧本节拍（秒）：入场后停留时长 / 扫描间隔
      stay-seconds: 15
      interval-seconds: 3
