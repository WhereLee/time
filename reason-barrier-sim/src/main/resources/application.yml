# 设备模拟器（十公里外的杆）：独立进程，仅 web 依赖
server:
  port: 8300
  # 监听面收敛：/sim/* 故障注入口无鉴权（定位是本地演示工具），只绑回环地址防公网暴露
  address: 127.0.0.1

sim:
  # 平台事件上报地址（reason-main 的 context-path=/api）
  event-url: http://127.0.0.1:8200/api/device/event
  # 平台心跳上报地址（周期自述 + 上电自述，平台侧 Redis TTL 判在线）
  heartbeat-url: http://127.0.0.1:8200/api/device/heartbeat
  # 心跳间隔秒（须小于平台 reason.barrier.heartbeat-timeout-seconds=30，留丢包容量）
  heartbeat-interval-seconds: 10
  # HTTP 超时（秒）——P5 参数化：原硬编码 2s/3s；可配 5-10s 按注入器剧本标定，留抖动余量
  connect-timeout-seconds: 2
  read-timeout-seconds: 5
  # 心跳并行线程上限（P5：每设备独立节拍，一台慢只丢自己的轮，不拖垮整组；
  # 批次2 B9 默认 8→16：50 台节拍 5rps + 延迟注入余量 ≈10 并发需求 <16，2 台日常无感）
  heartbeat-threads: 16
  # 升降动作耗时（毫秒）：模拟真实设备动作非瞬时
  move-millis: 3000
  # 事件通道形态（批次3，D-A 三态路由）：mq=仅 MQ（终态）/ http=仅 HTTP（降级）/ dual=双写（对照）
  # 缺省=代码默认 mq（终态，批次3 落档）——对照/注入剧本（需 HTTP 通道参与）用启动参数 --sim.event-channel=dual 覆盖
  # MQ 事件通道（阶段2 双写 → 批次3 三态路由；心跳不走 MQ——D3：判活不依赖 broker）
  mq:
    # MQ 通道启用开关（false=Bean 不创建，纯 HTTP 回滚形态；与 event-channel=mq 组合=启动失败——fail-fast）
    enabled: true
    # RocketMQ proxy gRPC 端点（本机 5.3.1：namesrv 9876 / broker 10911 / proxy 8081）
    endpoint: 127.0.0.1:8081
    # 事件 topic（单队列保序——D5；与平台消费订阅一致）
    topic: device-event
    # 失败缓冲队列容量（broker 故障积压；满则丢弃最旧记 error，平台 QUERY_STATE 兜底）
    buffer-size: 500
  # 本进程"安装"的物理杆清单（deviceNo 与平台台账登记对齐——契约握手；
  # secret=0.5 per-device HMAC 密钥，环境变量注入(仓库零明文)，须与平台 device_record.device_secret 同值）
  devices:
    - deviceNo: BARRIER-E-01
      name: 东门一号杆
      secret: ${BARRIER_E01_SECRET:}
    - deviceNo: BARRIER-W-02
      name: 西门二号杆
      secret: ${BARRIER_W02_SECRET:}

logging:
  level:
    com.reason.barrier: INFO
