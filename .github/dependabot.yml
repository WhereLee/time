# 依赖更新机器人（批次6 工程台账）：每周一自动开 PR，由 CI 双 job 把关
# 覆盖三个依赖域：根 pom（聚合 reason-main）、sim 独立模块、GitHub Actions
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: maven
    directory: "/reason-barrier-sim"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Spring Boot 4.x 属大版本跳跃（实测 barrier-sim CI 红，见 PR #1）；样例基线维持 3.2.x，major 升级需独立评估
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
