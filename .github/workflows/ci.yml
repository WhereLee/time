name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 单测（surefire *Test）+ 集成测试（failsafe *IT，Testcontainers 起真实 MySQL/Redis）
      # runner 自带 Docker；镜像首次拉取约 1-2 分钟
      - name: Maven verify
        run: mvn -B -ntp verify

  # 模拟器独立 job：reason-barrier-sim 不聚合父 pom（聚合与继承解耦设计），
  # 独立构建跑其 BarrierTest——协议双端任一边改动 CI 即刻红灯（T18 修复）
  barrier-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Sim tests
        run: mvn -B -ntp -f reason-barrier-sim/pom.xml test
