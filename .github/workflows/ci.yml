name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 单测（surefire *Test）+ 集成测试（failsafe *IT，Testcontainers 起真实 MySQL/Redis）
      # runner 自带 Docker；镜像首次拉取约 1-2 分钟
      # 阶段2：-DexcludedGroups=mq 把 RocketMQ 容器 IT 隔离到独立 job（broker 容器稳定性不拖累主 build）
      - name: Maven verify
        run: mvn -B -ntp verify -DexcludedGroups=mq

  # MQ 端到端 IT 独立 job（阶段2，规格 F2）：Testcontainers 起 namesrv+broker(--enable-proxy)，
  # 只跑 @Tag("mq") 的 DeviceEventMqIT——broker 容器不稳时红只影响本 job，主 build 绿仍可判定
  mq-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: MQ integration tests
        # -Dgroups=mq：surefire/failsafe 都只跑 mq tag（单测无 tag 自然零匹配）；-Dit.test 限定 IT 类
        run: mvn -B -ntp -pl reason-main verify -Dgroups=mq -Dit.test=DeviceEventMqIT

  # 模拟器独立 job：reason-barrier-sim 不聚合父 pom（聚合与继承解耦设计），
  # 独立构建跑其 BarrierTest——协议双端任一边改动 CI 即刻红灯（T18 修复）
  barrier-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Sim tests
        run: mvn -B -ntp -f reason-barrier-sim/pom.xml test
