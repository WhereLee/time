spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        druid:
            driver-class-name: com.mysql.cj.jdbc.Driver
            url: jdbc:mysql://localhost:3306/reason_faster?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
            # T16 凭据闭环保密：jasypt ENC() 承载（解密口令经环境变量 JASYPT_ENCRYPTOR_PASSWORD 注入，不落仓库）
            # 注：下列 ENC 为"演示密文"（明文=root，生成方法见部署手册"Jasypt 凭据生成"）。
            # 云部署时必须用你自己的解密口令重新生成密文（手册步骤 4）；明文凭据不进任何配置文件。
            username: ENC(eMBSNRK2CJZ+Ov15N71LIp3wXQi3tUd8x+A8RJYAe9QOPQxyI4uA73qjkNTCFQb0)
            password: ENC(5rO5mel0VvGKsPLurmemvv5txE9CcKpoOQ0tPmoNdUPbTeCy0VCI/Dd6zM0J18+Y)
            initial-size: 10
            max-active: 100
            min-idle: 10
            max-wait: 60000
            pool-prepared-statements: true
            max-pool-prepared-statement-per-connection-size: 20
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            #Oracle需要打开注释
            #validation-query: SELECT 1 FROM DUAL
            test-while-idle: true
            test-on-borrow: false
            test-on-return: false
            stat-view-servlet:
                enabled: false
                #url-pattern: /druid/*
                #login-username: ENC(ElkZdMTccZK76prWeG2A2BTciVNAaUntczYOn36vW08IYulNHrs3L5w6VcJSAhuU)
                #login-password: ENC(d/KxHWz4X3v6IVdFHGbGNHpfRVhzcwQfU8XKyqprtisPFpZ7JMSq/jLjqtKTbkaZ)
            filter:
                stat:
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: false
                wall:

    data:
        redis:
            database: 15
            host: localhost
            port: 6379
            password:    # 密码（默认为空）
            timeout: 6000ms  # 连接超时时长（毫秒）
            jedis:
              pool:
                max-active: 1000  # 连接池最大连接数（使用负值表示没有限制）
                max-wait: -1ms      # 连接池最大阻塞等待时间（使用负值表示没有限制）
                max-idle: 10      # 连接池中的最大空闲连接
                min-idle: 5       # 连接池中的最小空闲连接

