# 二维码尺寸和后缀
qrcode:
  width: 200
  height: 200
  suffix: png
# Tomcat
server:
  #tomcat:
    #uri-encoding: UTF-8
    #max-threads: 1000
    #min-spare-threads: 30
  port: 8200
  tomcat:
    connection-timeout: 5000ms
  servlet:
    context-path: /api

spring:
  # 环境 dev|test|prod —— T16：无默认值，必须显式指定（防止"漏配 profile 静默用错环境"）
  #   本地/演示：--spring.profiles.active=dev（或环境变量 SPRING_PROFILES_ACTIVE=dev）
  #   云部署：systemd 已显式 prod（见部署手册 + reason-main.service）
  # 不带 profile 启动：因缺少数据源配置而 fail-fast（预期行为，不是故障）
  # jackson时间格式化
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  quartz:
    # 任务调度器（spring-boot-starter-quartz 装配，原 ScheduleConfig 手写 Properties 平移至此）
    job-store-type: jdbc            # JDBC JobStore + LocalDataSourceJobStore（集群防重复调度基础）
    scheduler-name: ReasonScheduler
    auto-startup: true
    startup-delay: 30s              # 延时启动（与迁移前一致）
    overwrite-existing-jobs: true
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
      org.quartz.threadPool.threadCount: "25"
      org.quartz.threadPool.threadPriority: "5"
      org.quartz.jobStore.isClustered: "true"
      org.quartz.jobStore.clusterCheckinInterval: "15000"
      org.quartz.jobStore.maxMisfiresToHandleAtATime: "1"
      org.quartz.jobStore.misfireThreshold: "12000"
      org.quartz.jobStore.tablePrefix: QRTZ_
      # MySQL 锁 SQL（原代码为 SQLServer 的 UPDLOCK 写法，MySQL 语法错误——调度器实际启动即失败，已修正为 FOR UPDATE）
      org.quartz.jobStore.selectWithLockSQL: "SELECT * FROM {0}LOCKS WHERE LOCK_NAME = ? FOR UPDATE"
#  resources:
#    add-mappings: false


#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.reason.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
      id-type: AUTO
      #logic-delete-value: 1 #逻辑已删除值 注意：实际操作逻辑删除时，将status改为id，这样可以使用数据库unique
      #logic-not-delete-value: 0 #逻辑未删除值 不使用此逻辑删除功能，因为无法将status改为id
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

reason:
  redis:
    open: true
  cors:
    # 跨域白名单（T16：精确匹配 Origin；默认空=仅同源——未登记源一律拒绝，含 401 响应回显）
    # 需跨域接入前端时在此登记，例：['http://localhost:9527']
    allowed-origins: []
  security:
    # 强改密码检查豁免 URI（登录后仍需访问的必需接口；@Value 注入按逗号拆分）
    change-password-exempt-uris: /api/sys/menu/nav, /api/sys/user/info, /api/sys/logout, /api/sys/user/password
    # 登录防护（T19）：可信代理清单（逗号分隔）——仅这些地址来的请求才解析 X-Forwarded-For；
    # 默认空=忽略一切代理头（本地直连/无前置代理部署）；有 nginx 时登记其地址（如 127.0.0.1）
    trusted-proxies: ""
    # 登录防护（T19）：IP 维度失败闸——窗口内失败达上限则该 IP 拒绝登录（0=关闭）；账号维度策略见 sys_param(attempt_limit/lock_time)
    login-ip-max: 20
    login-ip-window-seconds: 600
  audit:
    # 批次5 审计降级：查询类（GET）是否写入 sys_log（false=不写——列表翻页不再写放大；需查询审计时打开）
    query-log-enabled: false
  # APP模块，是通过jwt认证的，如果要使用APP模块，则需要修改【加密秘钥】
  jwt:
    # 加密秘钥
    secret: f4e2e52034348f86b67cde581c0f9eb5[reason-faster]
    # token有效时长，7天，单位秒
    expire: 604800
    header: token
  device:
    # 设备模拟服务地址（本地双进程联调；接真实设备时此处即设备协议网关地址）
    # 注：设备通道鉴权已升级为 per-device HMAC（0.5），共享口令 X-Device-Token 已退役
    sim-base-url: http://127.0.0.1:8300
    # 上行入口限流（批次5）：Redis 令牌桶——per-device 防单设备洪峰；全局水位闸防平台过载
    # （全局超限拒绝事件=非关键上报；心跳为判活生命线不受全局闸）
    traffic:
      enabled: true
      device-rps: 5
      device-burst: 10
      global-rps: 100
      global-burst: 200
    # MQ 事件消费（阶段2：事件走 RocketMQ 与 HTTP 双写并行——D6；心跳留 HTTP 判活——D3）
    mq:
      # 消费开关（false=consumer 不启动，回滚纯 HTTP 形态）
      enabled: true
      # RocketMQ proxy gRPC 端点（本机 5.3.1：namesrv 9876 / broker 10911 / proxy 8081）
      endpoint: 127.0.0.1:8081
      # 事件 topic（单队列全局有序——D5 保序）
      topic: device-event
      # 消费组（broker 侧 retryMaxTimes=3：重投耗尽进死信）
      consumer-group: platform-device-event
  barrier:
    # 自动升降总开关（false=只手动，演示"纯人工接管"形态）
    auto-enabled: true
    # 白天放行窗口 [open, close)：窗口内应然=升起，窗口外应然=降下；open>close 表示跨午夜窗口
    auto-open-time: "08:00"
    auto-close-time: "18:00"
    # 心跳超时秒数（Redis 在线 key 的 TTL：超时无心跳 = 离线）
    heartbeat-timeout-seconds: 30
    # 指令到位超时秒数（下发后多久没等到目标状态事件 = 超时，触发重试）
    command-timeout-seconds: 60
    # 指令重试上限（超限停止重试并告警——失败显式化，不悄悄无限重试）
    max-retry: 3
    # 手动保持期分钟数（手动指令后自动规则让位的窗口）
    manual-hold-minutes: 30
    # 同类告警去重窗口秒数（持续异常不刷屏）
    alarm-dedup-seconds: 300
    # 告警限速（批次4 D-F）：per-type 全局滑动窗口，窗口内超上限只记日志不落库
    alarm-rate-window-seconds: 60
    alarm-rate-max-per-window: 10
    # 批量离线合并阈值（批次4 D-F）：单轮扫描离线数 >= 该值 -> 一条合并告警（替代 N 条）
    offline-batch-threshold: 3
    # 任务看护（批次4）：最后成功时间错过 N 次 cron 触发 -> 停摆告警
    job-stall-missed-triggers: 2
    # 对账连续异常升级阈值（批次4）：单台连续 N 轮处理异常 -> 升级告警
    reconcile-fail-streak-threshold: 5

jasypt:
  encryptor:
    # T16 闭环：ENC() 解密口令由环境变量 JASYPT_ENCRYPTOR_PASSWORD 注入（jasypt-spring-boot 内置支持），
    # 仓库与配置文件零明文；密文生成/部署流程见《云服务器部署手册》
    algorithm: PBEWITHHMACSHA512ANDAES_256
    key-obtention-iterations: 1000
    pool-size: 1
    provider-name: SunJCE
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    string-output-type: base64

# actuator 最小暴露：仅 health/info（不开放 metrics/mappings，避免信息泄漏）
management:
  endpoints:
    web:
      exposure:
        include: health,info
